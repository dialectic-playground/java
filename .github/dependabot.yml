# Keeps GitHub Actions (SHA-pinned) and the toolchain image digest current.
# Maven: each project's pom.xml (plugin versions and test dependencies are pinned there).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    # The release line (Java 25 (LTS, Eclipse Temurin)) is a deliberate choice shared with the native CI and
    # `make toolchain`; Dependabot refreshes digests but never changes minor or major versions.
    ignore:
      - dependency-name: "*"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: maven
    directory: /00-hello-world
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]
    commit-message:
      prefix: build
    # The owner's tooling choice is JUnit 5 (Jupiter); moving to a new major is deliberate.
    ignore:
      - dependency-name: "org.junit:junit-bom"
        update-types: ["version-update:semver-major"]

  # Hook revisions in .pre-commit-config.yaml (enforced by the pre-commit CI job).
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit:
        patterns: ["*"]
    commit-message:
      prefix: ci
